<title>Foamico Genius</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FBFCF8; --surface:#FFFFFF; --surface-2:#F4F7EE; --border:#E3E7DA;
  --text:#1A1A1A; --muted:#5A5A5A; --faint:#8A9179;
  --kiwi:#95C12B; --kiwi-deep:#3F5E12; --kiwi-ink:#1A1A1A; --tint:#E4F2C5;
  --gold:#B8901F; --gold-tint:#F7EFDA; --forest:#1F3D2F;
  --user-bg:#E4F2C5; --shadow:0 1px 2px rgba(26,26,26,.06),0 8px 24px -12px rgba(26,26,26,.14);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131610; --surface:#1C201A; --surface-2:#232821; --border:#2F3629;
    --text:#F0F2EA; --muted:#A8AF9B; --faint:#7C8470;
    --kiwi:#A6D138; --kiwi-deep:#C3E070; --kiwi-ink:#131610; --tint:#26301A;
    --gold:#D9B84A; --gold-tint:#2C2718; --forest:#B9D6C4;
    --user-bg:#2A3319; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#131610; --surface:#1C201A; --surface-2:#232821; --border:#2F3629;
  --text:#F0F2EA; --muted:#A8AF9B; --faint:#7C8470;
  --kiwi:#A6D138; --kiwi-deep:#C3E070; --kiwi-ink:#131610; --tint:#26301A;
  --gold:#D9B84A; --gold-tint:#2C2718; --forest:#B9D6C4;
  --user-bg:#2A3319; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:Poppins,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
  height:100vh; height:100dvh; overflow:hidden;
}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.bar{
  flex:none; z-index:20; background:var(--surface);
  border-bottom:1px solid var(--border); padding:12px 16px;
  display:flex; align-items:center; gap:12px;
}
/* the logo carries its own clear space in the artwork's outer box */
.logo{width:52px;height:52px;flex:none;display:block;margin:-8px 0}
.logo-dark{display:none}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .logo-light{display:none}
  :root:not([data-theme="light"]) .logo-dark{display:block}
}
:root[data-theme="dark"] .logo-light{display:none}
:root[data-theme="dark"] .logo-dark{display:block}
.rule{width:1px;height:26px;background:var(--border);flex:none;margin:0 2px}
.bar h1{
  font-family:Poppins,sans-serif; font-weight:600; font-size:15px;
  letter-spacing:0; margin:0; line-height:1.15;
}
.bar h1 .dot{color:var(--kiwi)}
.bar .sub{
  font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;
  font-weight:600;margin-top:1px;
  /* One line. In a 390px panel this wrapped to two and pushed the header to
     58px of chrome above a conversation that needed the height more. */
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* The name block is what gives way when the controls need the room - it can be
   clipped and still read, where a button cannot be clipped and still be pressed. */
.bar > div:not(.spacer){min-width:0}
.bar h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .spacer{flex:1}
.langsel{
  border:1px solid var(--border);background:var(--surface-2);color:var(--muted);
  border-radius:9px;height:34px;padding:0 6px;font-family:inherit;font-size:12px;
  font-weight:600;cursor:pointer;
}
.langsel:focus-visible{outline:2px solid var(--kiwi);outline-offset:2px}
.themebtn{
  border:1px solid var(--border); background:var(--surface-2); color:var(--muted);
  border-radius:9px; width:34px; height:34px; cursor:pointer; font-size:15px; line-height:1;
}
.themebtn:hover{color:var(--text)}
/* The dock's own controls, drawn here because this document owns the header
   the site's panel shows. Hidden until the document knows it is in a frame -
   opened on its own, the window's own chrome is the close button. */
.barbtn{
  display:none; flex:none; border:1px solid var(--border); background:var(--surface-2);
  color:var(--muted); border-radius:9px; width:34px; height:34px; cursor:pointer;
  align-items:center; justify-content:center; padding:0;
}
:root[data-framed] .barbtn{display:inline-flex}
.barbtn svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;fill:none}
.barbtn:hover{color:var(--text);border-color:var(--kiwi)}
.barbtn:focus-visible{outline:2px solid var(--kiwi);outline-offset:2px}
.themebtn:focus-visible,.chip:focus-visible,#send:focus-visible,#q:focus-visible{
  outline:2px solid var(--kiwi); outline-offset:2px;
}

/* ---------- stream ---------- */
.stream{flex:1;overflow-y:auto;padding:20px 16px 8px}
.inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.msg{display:flex}
.msg.me{justify-content:flex-end}
.me .bubble{
  background:var(--user-bg); border:1px solid var(--border); color:var(--text);
  padding:9px 14px; border-radius:16px 16px 4px 16px; max-width:82%; font-weight:500;
}
.ans{
  background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--kiwi);
  border-radius:4px var(--radius) var(--radius) 4px; box-shadow:var(--shadow);
  padding:16px 18px; width:100%;
}
.ans.veda{border-left-color:var(--gold)}

/* ---------- answer internals ---------- */
.eyebrow{
  font-size:10.5px; font-weight:700; letter-spacing:.11em; text-transform:uppercase;
  color:var(--kiwi-deep); margin-bottom:7px;
}
.veda .eyebrow{color:var(--gold)}
.title{font-family:Montserrat,sans-serif;font-weight:800;font-size:19px;letter-spacing:-.01em;line-height:1.2;text-wrap:balance;margin:0 0 2px}
.title em{font-style:normal;font-weight:600;color:var(--kiwi-deep)}
.veda .title em{color:var(--gold)}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.hero{font-family:Montserrat,sans-serif;font-weight:800;font-size:32px;letter-spacing:-.02em;line-height:1;margin:6px 0 2px}
.herolabel{font-size:12px;color:var(--muted);margin-bottom:12px}
.p{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.p:last-child{margin-bottom:0}
.p strong{color:var(--text);font-weight:600}

.pills{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.pill{
  font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;
  background:var(--surface-2);color:var(--muted);border:1px solid var(--border);
}
.pill.on{background:var(--tint);color:var(--kiwi-deep);border-color:transparent}
.veda .pill.on{background:var(--gold-tint);color:var(--gold)}

.scroll{overflow-x:auto;margin:12px -18px 0;padding:0 18px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:340px;color:var(--text)}
th{
  text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);padding:0 12px 6px 0;border-bottom:1px solid var(--border);white-space:nowrap;
}
td{padding:8px 12px 8px 0;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text)}
tr:last-child td{border-bottom:0}
th.n,td.n{text-align:right;padding-right:0}
td.n{font-variant-numeric:tabular-nums;font-weight:600}
td.name{font-weight:600;white-space:nowrap}
.warn{
  margin-top:12px;padding:9px 12px;border-radius:9px;background:var(--surface-2);
  border:1px solid var(--border);font-size:12.5px;color:var(--muted);
}
.warn b{color:var(--text)}
.layers{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:0}
.layers li{
  display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--border);font-size:13px;
}
.layers li:last-child{border-bottom:0}
.layers .num{
  font-size:10px;font-weight:700;color:var(--kiwi-deep);background:var(--tint);
  min-width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex:none;
}
.veda .layers .num{color:var(--gold);background:var(--gold-tint)}
.copy{
  margin-top:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted);
  font-family:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;
}
.copy:hover{color:var(--text);border-color:var(--kiwi)}
.copy:focus-visible{outline:2px solid var(--kiwi);outline-offset:2px}

/* ---------- assistant speech ---------- */
.say{display:flex;gap:10px;align-items:flex-start;width:100%}
.av{
  width:26px;height:26px;border-radius:50%;background:var(--tint);flex:none;margin-top:2px;
  display:grid;place-items:center;
}
.av::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--kiwi-deep)}
.say p{
  margin:0;font-size:14.5px;line-height:1.62;color:var(--text);max-width:88%;
}
.say p b{font-weight:600}
.say + .msg .ans, .msg.cardturn .ans{margin-left:36px;width:calc(100% - 36px)}
@media (max-width:520px){
  .msg.cardturn .ans{margin-left:0;width:100%}
}
.typing .dots{
  display:flex;gap:4px;align-items:center;height:26px;padding:0 4px;
}
.typing .dots span{
  width:6px;height:6px;border-radius:50%;background:var(--faint);
}
@media (prefers-reduced-motion:no-preference){
  .typing .dots span{animation:blink 1.15s infinite}
  .typing .dots span:nth-child(2){animation-delay:.18s}
  .typing .dots span:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,60%,100%{opacity:.28}30%{opacity:1}}
}

/* ---------- pitch / upsell ---------- */
.pitch{
  margin-top:14px;padding:13px 15px;border-radius:10px;
  background:var(--tint);border:1px solid transparent;
}
.veda .pitch{background:var(--gold-tint)}
.pitchhead{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:7px}
.feel{
  font-family:Montserrat,sans-serif;font-size:11px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--kiwi-deep);
}
.veda .feel{color:var(--gold)}
.badge{
  font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  background:var(--kiwi);color:var(--kiwi-ink);padding:3px 8px;border-radius:999px;
}
.badge.sm{font-size:9px;padding:2px 6px}
.pill.badgepill{background:var(--kiwi);color:var(--kiwi-ink);border-color:transparent;font-weight:700}
.veda .pill.badgepill{background:var(--gold);color:var(--kiwi-ink)}
.pitch .p{font-size:13px;color:var(--text);margin-bottom:7px}
.pitch .p:last-of-type{margin-bottom:0}
.pitch .warn{background:var(--surface);margin-top:9px}
.pitch .warn.upsell{border-color:var(--kiwi)}
.nextrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:11px}
.nextlabel{
  font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);
}
.next{
  font-family:Poppins,sans-serif;font-size:12px;font-weight:600;cursor:pointer;
  padding:5px 11px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);
}
.next:hover{border-color:var(--kiwi);color:var(--kiwi-deep)}
/* Opens the product on the site behind this panel. Filled where the follow-up
   questions beside it are outlined, because it leaves the conversation. */
.next.open3d{background:var(--kiwi);color:var(--kiwi-ink);border-color:transparent;font-weight:700}
.next.open3d:hover{background:var(--kiwi-deep);color:#FEFEFE;border-color:transparent}
.next:focus-visible{outline:2px solid var(--kiwi);outline-offset:2px}

/* ---------- composer ---------- */
.dock{
  flex:none;background:var(--bg);border-top:1px solid var(--border);
  /* The ground continues under the phone's home bar rather than stopping in a
     line above it. env() reads 0 wherever the host page has not opted into a
     covered viewport, which is exactly the fallback wanted. */
  padding:10px 16px calc(14px + env(safe-area-inset-bottom));
}
.dockin{max-width:720px;margin:0 auto}
.chips{
  display:flex;gap:7px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none;
  /* The row runs past the panel's edge on any width, and a chip cut through its
     own label reads as a clipping bug. Fading the last few pixels says "there
     is more this way" in the same breath. */
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent);
  mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent);
  scroll-snap-type:x proximity;
}
.chips::-webkit-scrollbar{display:none}
.chip{scroll-snap-align:start}
/* While the opening is still on screen the same four things are already being
   offered in the conversation, where someone who does not know what to ask is
   looking. Showing them twice reads as two different sets. The row comes back
   the moment there is a conversation for it to sit under. */
body.opening .chips{display:none}
.chip{
  flex:none;border:1px solid var(--border);background:var(--surface);color:var(--muted);
  font-family:inherit;font-size:12.5px;font-weight:500;padding:6px 13px;border-radius:999px;
  cursor:pointer;white-space:nowrap;
}
.chip:hover{border-color:var(--kiwi);color:var(--text)}
.row{display:flex;gap:8px}
#q{
  flex:1;border:1px solid var(--border);background:var(--surface);color:var(--text);
  font-family:inherit;font-size:15px;padding:12px 16px;border-radius:12px;min-width:0;
}
#q::placeholder{color:var(--faint)}
#send{
  border:0;background:var(--kiwi);color:var(--kiwi-ink);font-family:Montserrat,sans-serif;
  font-weight:700;font-size:14px;padding:0 20px;border-radius:12px;cursor:pointer;
  transition:background .2s ease,opacity .2s ease;
}
#send:hover{background:var(--kiwi-deep);color:#FEFEFE}
/* Nothing typed, nothing to send. Kept in the layout rather than hidden, so the
   composer does not change width the moment someone starts typing. */
#send:disabled{background:var(--surface-2);color:var(--faint);cursor:default;opacity:.85}
#send:disabled:hover{background:var(--surface-2);color:var(--faint)}
.foot{text-align:center;font-size:10.5px;color:var(--faint);margin-top:9px;letter-spacing:.03em}
/* A narrow panel - which, docked, is every panel: the frame is 400px wide on a
   desktop and the screen on a phone, and these queries measure the frame, not
   the display. So this is the header the site actually shows.

   The name and the controls cannot both fit one line at 390px, and of the two
   the name is what may not be clipped: "Mattre..." is not a name. The subtitle
   drops to a line of its own, where it gets the full width it needs - it states
   what the prices in here are, which is not a line to abbreviate. */
@media (max-width:560px){
  .bar{padding:9px 12px;gap:6px;flex-wrap:wrap}
  .bar .rule{display:none}
  .logo{width:34px;height:34px;margin:-2px 0}
  /* The wrapper stops being a box so its two lines can be placed
     independently: the name up with the controls, the subtitle under them. */
  .bar > div:not(.spacer){display:contents}
  /* The name is the only thing here that may give up width. Every control is
     fixed: a button that shrinks to fit is a button that stops being a target,
     and one that wraps to a second row is worse - it was the header growing to
     129px on a 320px screen, three rows of chrome over a conversation. */
  .bar h1{flex:1 1 auto;min-width:0;font-size:14.5px}
  .bar .sub{flex-basis:100%;order:9;margin-top:0;font-size:10.5px}
  .langsel,.themebtn,.barbtn{flex:none}
  .langsel{height:30px;font-size:11.5px;padding:0 3px}
  .themebtn,.barbtn{width:30px;height:30px}
  .barbtn svg{width:18px;height:18px}
}
/* The narrowest phones still in use. Everything gives up two more pixels so the
   row stays a row. */
@media (max-width:380px){
  .bar{padding:8px 10px;gap:5px}
  .logo{width:30px;height:30px}
  .bar h1{font-size:13.5px}
  .langsel{height:28px;font-size:11px}
  .themebtn,.barbtn{width:28px;height:28px}
  .barbtn svg{width:17px;height:17px}
}
@media (max-width:520px){
  .stream{padding:16px 12px 4px} .dock{padding:8px 12px calc(12px + env(safe-area-inset-bottom))}
  .ans{padding:14px 15px} .scroll{margin:12px -15px 0;padding:0 15px}
  .hero{font-size:28px}
}
@media (prefers-reduced-motion:no-preference){
  .msg{animation:rise .22s ease-out both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>

function parseSize(q){
  for(const [w,s] of Object.entries(NAMED)) if(new RegExp("\\b"+w+"\\b").test(q)) return s;
  let m=q.match(/(\d{2,3})\s*(?:x|by|\*)\s*(\d{2,3})/);

  if(m){const a=FT[m[1]],b=FT[m[2]];

function parseDims(q){

  if(!m) return null;

  if(a<=8&&b<=8){a=Math.round(a*12);b=Math.round(b*12);}

function fitSize(L,W){

  for(const s of SIZES){

function pickModel(){
  let lead,why;
  const W=why_();
  if(REC.seg==="budget"){ lead="SIGMA"; why=W.budget; }
  else if(REC.seg==="premium"){ lead="RIVA"; why=W.premium; }
  else if(REC.seg==="feel"){
    lead=REC.firm==="hard"?"SIGNATURE":REC.firm==="mediumfirm"?"MAGIC":REC.firm==="soft"?"MAXA":"DURO";
    why=W.feel;
  }
  else if(REC.heavy){ lead="SOVA"; why=W.heavy(REC.kg); }
  else if(REC.pos==="stomach"){ lead="ULTIMA"; why=W.stomach; }
  else if(REC.pos==="side"){ lead="LUMA"; why=W.side; }
  else { lead="RESTO"; why=W.light; }
  const keys=Object.keys(DB.skus).filter(function(k){return famOf(k)===lead;});
  return {lead:lead,why:why,house:houseOf(lead),
          from:keys.length?rupee(Math.min.apply(null,keys.map(function(k){return DB.skus[k].mrp[DEFAULT_SIZE];}))):null};
}

    kg: m?parseInt(m[1],10):null,
    heavy: /\b(above|over|more than)\s*90\b|\bheavy|\bbulky|\bbada\b/.test(q),
    side: /\bside sleeper|\bside\b|\bkarwat\b|\u0915\u0930\u0935\u091F/.test(q),
    toss: /\btoss|\bturn|\bboth sides|\brestless/.test(q),

  const prof=readProfile(q); REC._q=q;
  const wantsHouses=/\bbrands?\b|\bhouses?\b|\bvivo\b|\bvivorest\b|\bwhich brand|\bveda vs|\bdifference between (the )?brands/.test(q);
  const answeringQ=/\b(over|under|above|below)\s*90\b|\bon my (side|stomach)\b|\bside sleeper\b|\bstomach\b|\bnot sure\b|\bkarwat\b|\bpet ke bal\b|\bpata nahi\b/.test(q)
        || /90\s*(kg|kilo|\u0915\u093F\u0932\u094B)?\s*(se|\u0938\u0947)\s*(upar|kam|\u090A\u092A\u0930|\u0915\u092E)/.test(q)
        || /\u0915\u0930\u0935\u091F|\u092A\u0947\u091F \u0915\u0947 \u092C\u0932|\u092A\u0924\u093E \u0928\u0939\u0940\u0902/.test(q);
  const wantsRec=/\brecommend|\bsuggest|\bwhich (one|mattress|model)|\bwhat should|\bbest for|\bcustomer\b|\bclient\b|\bbatao\b|\bbataiye\b|\bkaunsa\b|\bkaun sa\b|\bsujhav\b|\bchoose\b|\bchoosing\b|\bhelp me\b|\bwhich should\b|\bkaunsa loon\b|\bchunna\b/.test(q)
                 || /\u0938\u091C\u0947\u0938\u094D\u091F|\u0938\u0941\u091D\u093E\u0935|\u0915\u094C\u0928 ?\u0938\u093E|\u092C\u0924\u093E\u0913|\u092C\u0924\u093E\u0907\u090F|\u0938\u0932\u093E\u0939|\u091A\u0941\u0928\u0942\u0901|\u091A\u0941\u0928\u0928\u093E|\u092E\u0926\u0926/.test(q)
                 || prof.kg!=null || prof.heavy || prof.side || prof.toss || prof.budget || prof.premium || prof.firm;
  if(wantsHouses&&!fams.length) out={say:pick(["We make three ranges \u2014 here's who each one is for.",
                                               "Three ranges. Here's how they differ."]),card:housesCard()};
  else if(wantsLadder&&!fams.length) out={say:LINE.ladder(),card:ladderCard()};
  else if((wantsRec||answeringQ)&&!fams.length){
    feedRec(prof);
    const need=recNeeds();
    if(need==="weight")        out=askWeight();
    else if(need==="position") out=askPosition();
    else {
      const r=pickModel();
      out={say:talkRec(r.lead,r.why,r.from,DEFAULT_SIZE),card:recommendCard(r),next:nextOf(r.lead,"")};
      if(r.house!=="FOAMICO")
        out.say=joinSay([out.say,r.house==="VIVOREST"
          ? "That's the Vivorest student range \u2014 no price for it in this book. The moment budget allows, move them onto Foamico."
          : "That's VedaSleep. If they'll listen, walk them across to the Foamico engineered range."]);
      resetRec();
    }
  }
  else if(/\bpillow|protector|accessor/.test(q)) out={say:LINE.pillow(),card:pillowCard()};
  else if(/\bwarrant/.test(q)&&!fams.length) out={say:LINE.warranty(),card:warrantyCard()};
  else if(/\bsizes?\b|size grid|dimension/.test(q)&&!fams.length&&!size) out={say:LINE.size(),card:sizeCard()};
  else if(bud&&!fams.length){
    const sz0=size||DEFAULT_SIZE;
    const n=Object.keys(DB.skus).filter(k=>DB.skus[k].mrp[sz0]<=+bud[1]).length;
    out={say:LINE.budget(rupee(+bud[1]),n),card:budgetCard(+bud[1],size)};
  }
  else if(fams.length>=2) out={say:LINE.compare(fams[0],fams[1]),card:compareCard(fams,size)};
  else if(fams.length===1&&!FAM[fams[0]]){
    resetRec();
    CTX={fam:null,v:null,size:CTX.size};
    out={say:joinSay([saySpec(fams[0],""),sayUpsell(fams[0],"")]),card:posCard(fams[0]),next:nextOf(fams[0],"")};
  }
  else if(fams.length===1){
    resetRec();
    const fam=fams[0];
    let hits=parseVariants(fam,q);
    if(hits.length>1&&CTX.fam===fam&&CTX.v&&!variantWord&&hits.indexOf(CTX.v)>=0) hits=[CTX.v];
    if(hits.length===1&&DB.skus[fam+" "+hits[0]]){
      const v=hits[0],key=fam+" "+v;
      if(custom){
        CTX={fam:fam,v:v,size:CTX.size};
        out=custom.kind==="over"
          ? {say:joinSay([LINE.over(fam,v),saySpec(fam,v)]),card:overCard(key,dims)}
          : {say:joinSay([LINE.up(fam,v,custom.size),saySpec(fam,v)]),card:upCard(key,dims,custom)};
      } else {
        const dflt=!size&&!CTX.size;
        CTX={fam:fam,v:v,size:size||CTX.size||DEFAULT_SIZE};
        if(specQ&&!size&&!priceWord) out={say:talkSpec(fam,v),card:specCard(key)};
        else out={say:talkPrice(fam,v,CTX.size,DB.skus[key].mrp[CTX.size],dflt),card:priceCard(key,CTX.size)};
      }
      out.next=nextOf(fam,v);
    } else {
      CTX={fam:fam,v:null,size:size||CTX.size};
      out=custom?{say:joinSay([LINE.custom(fam),saySpec(fam,"")]),card:customFamCard(fam,dims,custom)}
                :{say:talkFam(fam,size||DEFAULT_SIZE,!size),card:famCard(fam,size)};
      out.next=nextOf(fam,"");
    }
  }
  else if(bud) out={say:LINE.budget(rupee(+bud[1])),card:budgetCard(+bud[1],size)};

  if(out){
    if(greeted) out.say=pick([pick(t().hey),hourGreetL()+"! "])+out.say;
    if(!out.next && Math.random()<0.25) out.nudge=pick(NUDGE);
    return out;
  }

  /* nothing product-shaped \u2014 try small talk */
  for(const s of SMALLTALK){
    if(s.re.test(q)) return {say:s.r(),card:s.card?s.card():null};
  }
  if((size||custom)&&!fams.length){
    const lbl=custom?dimLabel(dims):sizeLabel(size);
    const note=custom?(custom.kind==="over"
        ? " That's oversize, so it'll go on the sq-ft calculator."
        : " That's under a stock size, so it'll bill at "+custom.size+".")
      :"";
    return {say:"I've got the size \u2014 <b>"+lbl+"</b> \u2014 but which model?"+note+" Try \u201CRiva "+lbl+"\u201D or \u201CSova "+lbl+"\u201D."};
  }
  if(/\b(weather|cricket|news|time|date|joke|jokes|funny|song|movie|politics|recipe)\b|\u091A\u0941\u091F\u0915\u0941\u0932\u093E|\u092E\u091C\u093C\u093E\u0915/.test(q)) return {say:t().offtopic};
  return {say:pick(t().lost),card:helpCard()};
}
/* kept for tests: flatten a turn to one html string */
function answer(t){const r=route(t);return (r.say?"<p>"+r.say+"</p>":"")+(r.card||"");}

/* ---------- chat ---------- */
const inner=document.getElementById("inner"),stream=document.getElementById("stream"),qEl=document.getElementById("q");
const AV='<div class="av" aria-hidden="true"></div>';
function el(cls,html){const d=document.createElement("div");d.className=cls;d.innerHTML=html;
  inner.appendChild(d);stream.scrollTop=stream.scrollHeight;return d;}
const sayMsg=t=>el("msg",'<div class="say">'+AV+"<p>"+t+"</p></div>");
const cardMsg=h=>el("msg cardturn",h);
const meMsg=t=>el("msg me",'<div class="bubble">'+esc(t)+"</div>");
const nextMsg=(a,label)=>el("msg cardturn",'<div class="nextrow">'+(label===""?"":'<span class="nextlabel">'+(label||"You might also like")+'</span>')+
  a.map(function(n){return '<button class="next" data-q="'+esc(n)+'">'+esc(n)+' \u203A</button>';}).join("")+'</div>');
function typingMsg(){return el("msg typing",'<div class="say">'+AV+'<div class="dots"><span></span><span></span><span></span></div></div>');}

let busy=false;
function ask(t){
  t=t.trim(); if(!t||busy) return;
  document.body.classList.remove("opening");
  busy=true; meMsg(t); qEl.value="";
  const r=route(t);
  const dots=typingMsg();
  const wait=380+Math.min(520,(r.card?260:0)+(r.say?r.say.length*7:0));
  setTimeout(function(){
    dots.remove();
    if(r.say) sayMsg(r.say);
    if(r.card) cardMsg(r.card);
    if(r.next&&r.next.length) nextMsg(r.next);
    if(r.nudge) setTimeout(function(){sayMsg(r.nudge);busy=false;},420);
    else busy=false;
  },wait);
}
/* ---------- the page around this one ----------------------------------------
 * Standalone, this document is the whole window: it has no header controls to
 * draw and nowhere to send anyone. Docked on the site it is a panel inside a
 * page and both become true - but the frame is sandboxed without
 * top-navigation, deliberately, so neither can be done from in here. The site
 * listens for these messages and decides; this side only ever asks.
 */
const FRAMED=window.parent!==window;
const BRIDGE="foamico-guide";
function tell(msg){ if(FRAMED) window.parent.postMessage(Object.assign({source:BRIDGE},msg),"*"); }
if(FRAMED) document.documentElement.setAttribute("data-framed","");

/* The site answers with its own product routes, and they are the only
   destinations this document can offer: a family the site did not name gets no
   button rather than a guessed URL that 404s. Keyed by the name in capitals,
   which is what both sides already call a product. */
let ROUTES={};
window.addEventListener("message",function(e){
  const d=e.data;
  if(!d||d.source!==BRIDGE||d.type!=="products"||!Array.isArray(d.routes)) return;
  const map={};
  d.routes.forEach(function(r){
    if(r&&r.family&&r.path) map[String(r.family).toUpperCase()]={path:r.path,name:r.name||r.family};
  });
  ROUTES=map;
});
function openCTA(fam){
  const r=ROUTES[String(fam||"").toUpperCase()];
  if(!r) return "";
  return '<button class="next open3d" data-open="'+esc(r.path)+'">Explore '+esc(r.name)+' in 3D</button>';
}

/* Minimise leaves the conversation where it is - the site keeps this frame
   mounted precisely so it survives. Close ends it, which is the difference
   between the two and the only reason there are two. */
document.getElementById("minimize").onclick=function(){ tell({type:"minimize"}); };
/* Escape, from inside the frame. The site listens for it too, but a keystroke
   typed with the caret in here never reaches that document - which is why
   Escape stopped working the moment anyone actually started using the guide. */
document.addEventListener("keydown",function(e){ if(e.key==="Escape") tell({type:"minimize"}); });
document.getElementById("close").onclick=function(){ tell({type:"close"}); opening(); };

/* Nothing typed, nothing to send. Disabled rather than hidden, so the composer
   does not change width the moment someone starts typing. */
const sendBtn=document.getElementById("send");
function syncSend(){ sendBtn.disabled=!qEl.value.trim(); }
qEl.addEventListener("input",syncSend);
syncSend();

sendBtn.onclick=function(){ask(qEl.value)};
qEl.addEventListener("keydown",function(e){if(e.key==="Enter")ask(qEl.value)});
inner.addEventListener("click",function(e){
  const o=e.target.closest(".open3d");
  if(o){ tell({type:"open-product",path:o.dataset.open}); return; }
  const n=e.target.closest(".next");
  if(n){ ask(n.dataset.q); return; }
  const b=e.target.closest(".copy"); if(!b) return;
  const done=function(){const o=b.textContent;b.textContent="Copied";setTimeout(function(){b.textContent=o},1400);};
  if(navigator.clipboard) navigator.clipboard.writeText(b.dataset.copy).then(done).catch(function(){b.textContent="Press \u2318C"});
  else b.textContent="Press \u2318C";
});
const CHIPS_L={
 en:["Help me choose","Which range suits me?","See the full range","Ultima Luxury queen","Riva 78x60","Under 20000","Pillows","All sizes"],
 hi:["\u092e\u0948\u091f\u094d\u0930\u0947\u0938 \u0938\u091c\u0947\u0938\u094d\u091f \u0915\u0930\u094b","\u0915\u094c\u0928 \u0938\u093e \u092c\u094d\u0930\u093e\u0902\u0921 \u0915\u093f\u0938\u0915\u0947 \u0932\u093f\u090f","Ultima Luxury queen","Riva 78x60","20000 \u0938\u0947 \u0915\u092e","\u090f\u0915 \u091a\u0941\u091f\u0915\u0941\u0932\u093e","Pillows","\u0938\u092d\u0940 \u0938\u093e\u0907\u091c\u093c"],
 hr:["Mattress suggest karo","Kaunsa brand kiske liye","Ultima Luxury queen","Riva 78x60","20000 se kam","Pillows","Sabhi size"]
};
const PLACEHOLDER={en:"Ask a price, size or spec\u2026",
  hi:"\u0930\u0947\u091f, \u0938\u093e\u0907\u091c\u093c \u092f\u093e \u0938\u094d\u092a\u0947\u0915 \u092a\u0942\u091b\u093f\u090f\u2026",
  hr:"Rate, size ya spec poochhiye\u2026"};
let CHIPS=CHIPS_L.en;
const chips=document.getElementById("chips");
function drawChips(){chips.innerHTML="";
  CHIPS.forEach(function(c){const b=document.createElement("button");b.className="chip";b.textContent=c;
    b.onclick=function(){ask(c)};chips.appendChild(b);});}
drawChips();

/* language */
const ls=document.getElementById("lang");
ls.value=LANG;
ls.onchange=function(){
  LANG=ls.value; try{localStorage.setItem("fg-lang",LANG)}catch(e){}
  CHIPS=CHIPS_L[LANG]||CHIPS_L.en; drawChips();
  qEl.placeholder=PLACEHOLDER[LANG]||PLACEHOLDER.en;
  opening();
};

/* theme */
const tb=document.getElementById("theme");
let stored=null; try{stored=localStorage.getItem("fg-theme")}catch(e){}
if(stored) document.documentElement.setAttribute("data-theme",stored);
tb.onclick=function(){
  const cur=document.documentElement.getAttribute("data-theme");
  const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  const next=dark?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  try{localStorage.setItem("fg-theme",next)}catch(e){}
};

/* opening \u2014 staggered, like someone typing */
function opening(){
  inner.innerHTML="";
  document.body.classList.add("opening");
  sayMsg(hourGreetL()+"! "+t().intro);
  setTimeout(function(){sayMsg(t().introB)},700);
  setTimeout(function(){sayMsg(t().introC)},1600);
  /* Four things to tap, in the conversation, where someone who does not yet
     know what to type is looking. The same list the chip row carries and the
     same handler behind them - these are not a second set of shortcuts, they
     are the first four of the one set, offered where the question is being
     asked. No label: nothing has been said yet for them to follow on from. */
  setTimeout(function(){nextMsg(CHIPS.slice(0,4),"")},2300);
}
try{const st=localStorage.getItem("fg-lang"); if(st&&LANGS[st]) LANG=st;}catch(e){}
opening();
</script>
