<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/vedasleep-logo.png" />
    <!-- viewport-fit=cover: the document is the whole screen, not the part of
         it the browser is not standing on. Without it iOS lays the page out
         inside the safe area and paints the strip above and below in a flat
         colour of its own choosing, which reads as two blocks bracketing the
         page. With it the page's own ground runs edge to edge and the
         browser's furniture floats over it.

         The cost is that content anchored to an edge can end up under the
         status bar or the home indicator, so everything that sits at one takes
         env(safe-area-inset-*) - see --safe-top and its siblings in
         src/index.css, which is where those are named once. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- What iOS Safari tints its status bar and toolbar with. Kept in step
         with the route by PageGround in src/App.jsx; this is the cold-load
         value. Without it Safari samples the page background instead, which is
         how a cream band ended up above and below a black page. -->
    <meta name="theme-color" content="#1A1A1A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Poppins:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <title>Legend Product Deck 2026</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
