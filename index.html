<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/vedasleep-favicon.png" />
    <!-- viewport-fit=cover: the document is the whole screen, not the part of
         it the browser is not standing on. Without it iOS lays the page out
         inside the safe area and paints the strip above and below in a flat
         colour of its own choosing, which reads as two blocks bracketing the
         page. With it the page's own ground runs edge to edge and the
         browser's furniture floats over it.

         The cost is that content anchored to an edge can end up under the
         status bar or the home indicator, so everything that sits at one takes
         env(safe-area-inset-*) - see --safe-top and its siblings in
         src/index.css, which is where those are named once. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- What iOS Safari tints its status bar and toolbar with. Kept in step
         with the route by PageGround in src/App.jsx; this is the cold-load
         value. Without it Safari samples the page background instead, which is
         how a cream band ended up above and below a black page. -->
    <meta name="theme-color" content="#1A1A1A" />
    <title>Legend Product Deck 2026</title>
    <meta
      name="description"
      content="Explore the FOAMICO and VedaSleep mattress collections by Legend Polyfoams in interactive 3D, and see each mattress's layer-by-layer construction."
    />
    <!-- Routes are hash-based, so every page is this one document. -->
    <link rel="canonical" href="https://myfoamico.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://myfoamico.com/" />
    <meta property="og:site_name" content="Legend Product Deck 2026" />
    <meta property="og:title" content="Legend Product Deck 2026" />
    <meta
      property="og:description"
      content="Explore the FOAMICO and VedaSleep mattress collections by Legend Polyfoams in interactive 3D, and see each mattress's layer-by-layer construction."
    />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://myfoamico.com/#organization",
            "name": "Legend Polyfoams",
            "url": "https://myfoamico.com/",
            "brand": [
              { "@type": "Brand", "name": "FOAMICO" },
              { "@type": "Brand", "name": "VedaSleep" }
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://myfoamico.com/#website",
            "name": "Legend Product Deck 2026",
            "url": "https://myfoamico.com/",
            "publisher": { "@id": "https://myfoamico.com/#organization" }
          }
        ]
      }
    </script>
    <!-- The brand selector's two marks are the first thing painted, but they
         are <img>s React renders, so without these the browser cannot start
         fetching them until the script has run. Kept in step with the src and
         srcSet in src/pages/BrandSelectPage.jsx. -->
    <link
      rel="preload"
      as="image"
      href="/brand/foamico-logo-light.webp"
      imagesrcset="/brand/foamico-logo-light@1x.webp 1x, /brand/foamico-logo-light.webp 2x"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/brand/vedasleep-logo.webp"
      imagesrcset="/brand/vedasleep-logo@1x.webp 1x, /brand/vedasleep-logo.webp 2x, /brand/vedasleep-logo@3x.webp 3x"
      fetchpriority="high"
    />
    <!-- The one face the selector sets text in. The rest of the fonts are
         declared in src/fonts/fonts.css and load as they are needed. -->
    <link rel="preload" as="font" type="font/woff2" href="/assets/poppins-400-latin-cpxAROuN.woff2" crossorigin />
    <script type="module" crossorigin src="/assets/index-b5t2qBa9.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DnALpL2e.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
