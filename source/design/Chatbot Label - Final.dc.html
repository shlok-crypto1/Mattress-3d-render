<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EDEAE3;font-family:Poppins,sans-serif}
a{color:#3F5E12}a:hover{color:#95C12B}
</style>
</helmet>
<div style="display:flex;flex-direction:column;gap:20px;padding:40px;box-sizing:border-box">
  <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
    <div style="font-weight:500;font-size:18px;color:#1A1A1A">Chatbot label: final (2b)</div>
    <button onClick="{{ replay }}" style="font-family:Poppins;font-weight:500;font-size:13px;background:#1A1A1A;color:#FEFEFE;border:none;border-radius:999px;padding:9px 18px;cursor:pointer">Replay pop-up</button>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:24px">
    <div style="display:flex;flex-direction:column;gap:12px;background:#FEFEFE;border-radius:14px;padding:20px;width:620px;max-width:100%;box-sizing:border-box">
      <div style="font-weight:500;font-size:12px;letter-spacing:.14em;color:#3F5E12">FOAMICO + VEDASLEEP</div>
      <div style="position:relative;height:150px;border-radius:10px;overflow:hidden;background:radial-gradient(circle at 30% 20%,#EFE3CF,#F5F3EE 60%)">
        <div style="position:absolute;right:16px;bottom:16px;display:flex;align-items:center;gap:14px">
          <div style="font-family:Poppins;font-weight:400;font-size:12px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;color:#6B6B6B;opacity:{{ op }};transform:{{ tf }};transition:opacity .6s ease, transform .6s ease;cursor:pointer">For Product Details and Prices →</div>
          <div style="flex:none;width:56px;height:56px;border-radius:50%;background:#95C12B;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.6-5A8.5 8.5 0 1 1 21 11.5z"></path></svg></div>
        </div>
      </div>
      <div style="position:relative;width:300px;height:130px;border-radius:10px;overflow:hidden;background:radial-gradient(circle at 30% 20%,#EFE3CF,#F5F3EE 60%);align-self:flex-end">
        <div style="position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:10px">
          <div style="font-family:Poppins;font-weight:400;font-size:10px;letter-spacing:.12em;line-height:1.6;text-transform:uppercase;text-align:right;color:#6B6B6B;width:170px;opacity:{{ op }};transform:{{ tf }};transition:opacity .6s ease, transform .6s ease">For Product Details and Prices →</div>
          <div style="flex:none;width:46px;height:46px;border-radius:50%;background:#95C12B;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.6-5A8.5 8.5 0 1 1 21 11.5z"></path></svg></div>
        </div>
      </div>
    </div>
  </div>
  <div style="font-size:13px;color:#6B6B6B;line-height:1.7;max-width:620px">Code for your developer: <a href="foamico-chat-label.js">foamico-chat-label.js</a>. Paste it in before <code>&lt;/body&gt;</code>.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;delay&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:5,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;s&quot;,&quot;default&quot;:1.5,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { shown: false };
  componentDidMount() { this.schedule(); }
  componentWillUnmount() { clearTimeout(this.t1); }
  schedule() { clearTimeout(this.t1); this.t1 = setTimeout(() => this.setState({ shown: true }), (this.props.delay ?? 1.5) * 1000); }
  renderVals() {
    const s = this.state.shown;
    return { op: s ? 1 : 0, tf: s ? 'translateY(0)' : 'translateY(6px)', replay: () => { this.setState({ shown: false }); this.schedule(); } };
  }
}
</script>
</body>
</html>
