name: Auto-Deployment to MyFoamico Server
# Author: Akshay Khurana, TheCreatology © 2026
run-name: Deploy Website by TheCreatology

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # This is the directory myfoamico.com serves, confirmed against the
          # live domain. `domains/myfoamico.com/public_html/` also exists on
          # the account and looks like the obvious candidate, but nothing
          # served from it is reachable - do not "correct" this to that.
          server-dir: /public_html/
          # The action tracks what it has uploaded in a state file beside the
          # site. The original one described the first deployment, whose files
          # were then moved by hand into `Mattress-3d-render/`, so every run
          # after that failed on a 550 for a file the state said was there and
          # the directory no longer held. This name starts from an accurate
          # record. Deleting it from the server forces a full re-upload.
          state-name: .deploy-state.json
          # Only the built site belongs on the web server: index.html and the
          # asset directories the build emits (assets, brand, products,
          # textures), which the repo root is kept as a mirror of.
          #
          # Everything below is repository-only. `source/` alone is 250 MB of
          # raw product imagery, which is what turned the first deployment into
          # a 19-minute, 298 MB upload of material no page ever requests.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/.claude/**
            app/**
            source/**
            docs/**
            guidelines/**
            *.md
            *.code-workspace
