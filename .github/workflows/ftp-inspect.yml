# Temporary diagnostic. Lists the FTP account's directory layout so the
# deployment can be pointed at the directory myfoamico.com actually serves.
# Manual trigger only - it never runs on a push, and it only reads.
# Delete this file once server-dir in deploy.yml is confirmed.
name: Inspect FTP layout

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List directories
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # The data channel has to be TLS-protected and passive, or the
          # control connection authenticates and every listing then hangs.
          cat > /tmp/cmds <<'CMDS'
          set ssl:verify-certificate no
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 2
          echo "=== home ==="
          cls -1
          echo "=== domains/ ==="
          cls -1 domains/
          echo "=== domains/myfoamico.com/ ==="
          cls -1 domains/myfoamico.com/
          echo "=== domains/myfoamico.com/public_html/ ==="
          cls -1 domains/myfoamico.com/public_html/
          echo "=== public_html/ ==="
          cls -1 public_html/
          bye
          CMDS
          timeout 180 lftp -u "$USER","$PASS" "ftps://$SERVER" -e "source /tmp/cmds" || true
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          USER: ${{ secrets.FTP_USERNAME }}
          PASS: ${{ secrets.FTP_PASSWORD }}
