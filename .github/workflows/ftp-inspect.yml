# Temporary diagnostic. Lists the FTP account's directory layout so the
# deployment can be pointed at the directory myfoamico.com actually serves.
# Manual trigger only - it never runs on a push, and it only reads.
# Delete this file once server-dir in deploy.yml is confirmed.
name: Inspect FTP layout

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # basic-ftp is the client FTP-Deploy-Action itself uses. lftp
      # authenticates against this server and then hangs on every listing -
      # the data channel needs a resumed TLS session, which this client
      # already handles, since it uploads here successfully.
      - name: List directories
        run: |
          npm install --silent --no-fund --no-audit basic-ftp@5
          node -e '
            const ftp = require("basic-ftp");
            (async () => {
              const c = new ftp.Client(30000);
              try {
                await c.access({
                  host: process.env.SERVER,
                  user: process.env.USER_,
                  password: process.env.PASS,
                  secure: true,
                  secureOptions: { rejectUnauthorized: false },
                });
                for (const d of [
                  "/",
                  "/domains",
                  "/domains/myfoamico.com",
                  "/domains/myfoamico.com/public_html",
                  "/public_html",
                ]) {
                  console.log("=== " + d + " ===");
                  try {
                    for (const f of await c.list(d)) {
                      console.log((f.isDirectory ? "d " : "- ") + f.name);
                    }
                  } catch (e) {
                    console.log("(" + e.message + ")");
                  }
                }
              } finally {
                c.close();
              }
            })().catch((e) => { console.error(e); process.exit(1); });
          '
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          USER_: ${{ secrets.FTP_USERNAME }}
          PASS: ${{ secrets.FTP_PASSWORD }}
